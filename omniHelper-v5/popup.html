<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OmniChat AutoResponder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1f2e;
            color: #fff;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 16px;
            font-weight: 600;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 12px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }
        
        .status-dot.off { background: #ef4444; }
        .status-dot.processing { background: #fbbf24; animation: pulse 1s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .content { padding: 16px; }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .stat-card {
            background: #252b3d;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 11px;
            color: #8892b0;
            margin-top: 4px;
        }
        
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252b3d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        
        .toggle-label { font-size: 14px; }
        
        .toggle {
            position: relative;
            width: 44px;
            height: 24px;
        }
        
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #3a4050;
            border-radius: 24px;
            transition: 0.3s;
        }
        
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        
        input:checked + .toggle-slider {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }
        
        .buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #252b3d;
            color: #8892b0;
        }
        
        .btn-secondary:hover {
            background: #303850;
            color: white;
        }
        
        .queue-section {
            margin-top: 16px;
            background: #252b3d;
            border-radius: 8px;
            padding: 12px;
        }
        
        .queue-title {
            font-size: 12px;
            color: #8892b0;
            margin-bottom: 8px;
        }
        
        .queue-empty {
            text-align: center;
            color: #505870;
            font-size: 13px;
            padding: 12px;
        }
        
        .queue-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: #1a1f2e;
            border-radius: 4px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        
        .queue-item:last-child { margin-bottom: 0; }
        
        .queue-id { color: #fff; }
        
        .queue-status {
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
        }
        
        .queue-status.pending { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .queue-status.processing { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        
        .footer {
            padding: 12px 16px;
            border-top: 1px solid #252b3d;
            font-size: 11px;
            color: #505870;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AutoResponder</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Loading...</span>
        </div>
    </div>
    
    <div class="content">
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="processedCount">0</div>
                <div class="stat-label">Обработано</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="queueLength">0</div>
                <div class="stat-label">В очереди</div>
            </div>
        </div>
        
        <div class="toggle-row">
            <span class="toggle-label">Автоответ</span>
            <label class="toggle">
                <input type="checkbox" id="autoToggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" id="checkBtn">🔍 Проверить</button>
            <button class="btn btn-secondary" id="clearBtn">🧹 Очистить</button>
        </div>
        
        <div class="queue-section">
            <div class="queue-title">Очередь обработки</div>
            <div id="queueList">
                <div class="queue-empty">Пусто</div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        v5.0 • Console: omniResponder.help()
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
